name: Evals

on:
  schedule:
    - cron: "0 21 * * 0"  # Monday 02:30 IST
  workflow_dispatch:
    inputs:
      memo_cases:
        description: Generated memos per prompt format
        default: "8"

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt deepeval==4.2.8
      - run: python -m evals.run_evals --memo-cases ${{ inputs.memo_cases || '8' }}
        working-directory: backend
      - run: cat backend/evals/results/latest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eval-results
          path: backend/evals/results/
