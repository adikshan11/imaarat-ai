name: CI

on:
  push:
    branches: [main, feature/how_it_works]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  GEMINI_API_KEY: ""
  QDRANT_URL: ""
  QDRANT_API_KEY: ""
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
  DATABASE_URL: ""
  DATABASE_URL_FILE: ""

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:e31e3d5327d1806f6177827c9710643e4f35f7ab3f14d26d05332753d3e95ee0
        env:
          POSTGRES_DB: imaarat_test
          POSTGRES_USER: identity_test
          POSTGRES_PASSWORD: isolated_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity_test -d imaarat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      IDENTITY_TEST_DATABASE_URL: postgresql+psycopg://identity_test:isolated_test_only@localhost:5432/imaarat_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest httpx
      - name: Install isolated OpenBao test binary
        run: |
          mkdir -p "$RUNNER_TEMP/openbao-test"
          curl --fail --silent --show-error --location https://github.com/openbao/openbao/releases/download/v2.7.1/openbao_2.7.1_linux_amd64.tar.gz --output "$RUNNER_TEMP/openbao-test/release.tar.gz"
          echo "0e2f1ce10d124e03112b50dd2fbec6b78003783253bc3a91587938f39d1e2243  $RUNNER_TEMP/openbao-test/release.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/openbao-test/release.tar.gz" -C "$RUNNER_TEMP/openbao-test"
          echo "BAO_TEST_BINARY=$RUNNER_TEMP/openbao-test/bao" >> "$GITHUB_ENV"
      - run: pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run check:locales && npm run build
        working-directory: frontend

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipeline/requirements.txt
      - run: python extract.py
        working-directory: pipeline
      - run: dbt build --profiles-dir .
        working-directory: pipeline/dbt
