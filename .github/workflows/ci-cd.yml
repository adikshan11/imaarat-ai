name: CI/CD

# Check and Test run on every pull request and every push to preprod or main.
# Only a push deploys: preprod goes to imaarat-ai-preprod.vercel.app and main to production, each smoke-tested.
# Preprod is then stress-tested read-only, because it shares production's database.

on:
  push:
    branches: [main, preprod]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check branch name, version bump and changelog
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/release_check.py
      - name: Scan every commit for secrets with Gitleaks
        run: |
          curl -sSL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml --exit-code 1 .
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff==0.14.0
      - name: Check Python code style with Ruff
        run: ruff check backend pipeline
      - name: Check Python code formatting with Ruff
        run: ruff format --check backend pipeline
      - name: Measure the Vercel function's dependencies
        env:
          BUDGET_MB: "180"
        run: bash .github/scripts/function_size.sh
      - name: Check JSON files are valid and formatted
        run: bash .github/scripts/check_json.sh
      - name: Install YAML and schema linters
        run: pip install yamllint==1.38.0 check-jsonschema==0.38.2
      - name: Check YAML files with yamllint
        run: git ls-files -z '*.yml' '*.yaml' | xargs -0 yamllint --strict
      - name: Check workflows against the GitHub Actions schema
        run: check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml
      - name: Check workflows and their shell steps with actionlint
        run: |
          curl -sSL -o "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Check shell scripts with ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Check translations match English
        run: npm run check:locales
        working-directory: frontend
      - name: Check code style with Oxlint
        run: npm run lint
        working-directory: frontend
      - name: Check for deprecated TypeScript and React APIs
        run: npm run check:deprecated
        working-directory: frontend

  test-backend:
    name: Test backend
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:e31e3d5327d1806f6177827c9710643e4f35f7ab3f14d26d05332753d3e95ee0
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only@localhost:5432/postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx pytest-timeout==2.4.0
      - name: Run backend tests against Postgres
        run: pytest -q --timeout=120
        working-directory: backend

  test-frontend:
    name: Test frontend
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Type-check and build
        run: npm run build
        working-directory: frontend
      - name: Run unit tests
        run: npm test
        working-directory: frontend
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run browser tests
        run: npm run test:browser
        working-directory: frontend
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/browser-tools

  test-pipeline:
    name: Test pipeline
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Extract demo tables to Parquet
        run: python extract.py
        working-directory: pipeline
      - name: Build and test dbt models
        run: dbt build --profiles-dir .
        working-directory: pipeline/dbt

  test-container:
    name: Test container
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the API and web images
        run: docker compose build
      - name: Start Postgres, API and web
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test the stack
        run: .github/scripts/smoke_check.sh http://localhost:8080
      - name: Log image sizes
        run: docker image ls --format "{{.Repository}}:{{.Tag}} {{.Size}}" | grep -i imaarat || true
      - name: Log containers on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy
    if: github.event_name == 'push'
    needs: [check, test-backend, test-frontend, test-pipeline, test-container]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preprod' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: team_IjFtm7aRrxcQ8mlUKZGG864P
      VERCEL_PROJECT_ID: prj_KG8CVLdeu5KR5eyJnuPWTHyS12zT
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      TARGET: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Deploy to Vercel
        id: deploy
        timeout-minutes: 8
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::Add the VERCEL_TOKEN repository secret to deploy from CI"; exit 1; fi
          if [ "$TARGET" = "main" ]; then
            npx --yes vercel@62.7.0 deploy --prod --yes --token "$VERCEL_TOKEN"
            url=https://imaarat-ai.vercel.app
          else
            url=$(npx --yes vercel@62.7.0 deploy --yes --token "$VERCEL_TOKEN")
          fi
          if [ "$TARGET" = "preprod" ]; then
            curl -sS --fail-with-body -X POST "https://api.vercel.com/v2/deployments/${url#https://}/aliases?teamId=$VERCEL_ORG_ID" -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" -d '{"alias":"imaarat-ai-preprod.vercel.app"}'
            url=https://imaarat-ai-preprod.vercel.app
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test the deployment
        run: |
          if [ "$TARGET" != "main" ] && [ -z "$BYPASS" ]; then echo "::error::Add the VERCEL_AUTOMATION_BYPASS_SECRET repository secret so CI can open protected previews"; exit 1; fi
          .github/scripts/smoke_check.sh "${{ steps.deploy.outputs.url }}"

  stress:
    name: Stress test
    if: github.event_name == 'push' && github.ref_name == 'preprod'
    needs: [deploy]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      USERS: "30"
      DURATION: 2m
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Locust
        run: pip install locust==2.46.7
      - name: Stress test preprod without writing data
        id: stress
        run: >
          locust -f backend/load/locustfile.py Reader --headless
          -u "$USERS" -r 5 -t "$DURATION"
          --host https://imaarat-ai-preprod.vercel.app/api --csv stress --html stress.html
      - name: Write the job summary
        if: always() && steps.stress.outcome != 'skipped'
        run: |
          echo "### Preprod, $USERS readers, $DURATION" >> "$GITHUB_STEP_SUMMARY"
          python backend/load/summary.py stress_stats.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stress-test
          path: |
            stress*.csv
            stress.html
          retention-days: 30
