name: CI/CD

# Check and Test run on every pull request and every push to main.
# Deploy then publishes a preview for a pull request, or production for main, and smoke-tests it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check branch name, version bump and changelog
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/release_check.py
      - name: Scan every commit for secrets with Gitleaks
        run: |
          curl -sSL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml --exit-code 1 .
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff==0.14.0
      - name: Check Python code style with Ruff
        run: ruff check backend pipeline
      - name: Check Python code formatting with Ruff
        run: ruff format --check backend pipeline
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Check translations match English
        run: npm run check:locales
        working-directory: frontend
      - name: Check code style with Oxlint
        run: npm run lint
        working-directory: frontend

  test-backend:
    name: Test backend
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:e31e3d5327d1806f6177827c9710643e4f35f7ab3f14d26d05332753d3e95ee0
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only@localhost:5432/postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx pytest-timeout==2.4.0
      - name: Run backend tests against Postgres
        run: pytest -q --timeout=120
        working-directory: backend

  test-frontend:
    name: Test frontend
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Type-check and build
        run: npm run build
        working-directory: frontend
      - name: Run unit tests
        run: npm test
        working-directory: frontend
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run browser tests
        run: npm run test:browser
        working-directory: frontend
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/browser-tools

  test-pipeline:
    name: Test pipeline
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Extract demo tables to Parquet
        run: python extract.py
        working-directory: pipeline
      - name: Build and test dbt models
        run: dbt build --profiles-dir .
        working-directory: pipeline/dbt

  test-container:
    name: Test container
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the API and web images
        run: docker compose build
      - name: Start Postgres, API and web
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test the stack
        run: .github/scripts/smoke_check.sh http://localhost:8080
      - name: Log image sizes
        run: docker image ls --format "{{.Repository}}:{{.Tag}} {{.Size}}" | grep -i imaarat || true
      - name: Log containers on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [check, test-backend, test-frontend, test-pipeline, test-container]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ github.event_name == 'push' && 'production' || github.ref }}
      cancel-in-progress: false
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: team_IjFtm7aRrxcQ8mlUKZGG864P
      VERCEL_PROJECT_ID: prj_KG8CVLdeu5KR5eyJnuPWTHyS12zT
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}
    steps:
      # A pull request deploys its own head commit: Vercel blocks the merge commit GitHub creates, which is not authored by the account owner.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Deploy to Vercel
        id: deploy
        timeout-minutes: 8
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::Add the VERCEL_TOKEN repository secret to deploy from CI"; exit 1; fi
          url=$(npx --yes vercel@62.7.0 deploy $PROD_FLAG --yes --token "$VERCEL_TOKEN")
          if [ "${{ github.event_name }}" = "push" ]; then url=https://imaarat-ai.vercel.app; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test the deployment
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -z "$BYPASS" ]; then echo "::error::Add the VERCEL_AUTOMATION_BYPASS_SECRET repository secret so CI can open protected previews"; exit 1; fi
          .github/scripts/smoke_check.sh "${{ steps.deploy.outputs.url }}"
