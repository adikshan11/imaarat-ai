name: Nightly ELT

on:
  schedule:
    - cron: "30 20 * * *"  # 02:00 IST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  elt:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipeline/requirements.txt
      - name: Extract operational tables to Parquet
        run: python extract.py
        working-directory: pipeline
      - name: Transform and test with dbt on DuckDB
        run: dbt build --profiles-dir .
        working-directory: pipeline/dbt
      - name: Publish the analytics snapshot
        run: python publish.py
        working-directory: pipeline
      - name: Build the dbt docs and lineage site
        run: dbt docs generate --profiles-dir . --static
        working-directory: pipeline/dbt
      - run: mkdir site && cp pipeline/dbt/target/static_index.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  docs:
    needs: elt
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
