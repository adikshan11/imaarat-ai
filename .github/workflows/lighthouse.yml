name: Lighthouse

on:
  workflow_dispatch:
    inputs:
      url:
        description: Pages to audit, separated by spaces
        default: https://imaarat-ai.vercel.app/ https://imaarat-ai.vercel.app/app/
  schedule:
    - cron: "0 3 * * 1"
  pull_request:
    paths:
      - .github/workflows/lighthouse.yml
      - .github/scripts/lighthouse_summary.mjs

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      AUDIT_URLS: ${{ inputs.url || 'https://imaarat-ai.vercel.app/ https://imaarat-ai.vercel.app/app/' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm install --prefix "$RUNNER_TEMP/lighthouse" --no-save --package-lock=false lighthouse@13.5.0
      - name: Audit mobile and desktop
        run: |
          mkdir -p reports
          LH="$RUNNER_TEMP/lighthouse/node_modules/.bin/lighthouse"
          FLAGS='--only-categories=performance,accessibility,best-practices,seo --output=json --output=html --chrome-flags=--headless=new --quiet'
          for url in $AUDIT_URLS; do
            name=$(echo "$url" | grep -q "/app/" && echo app- || true)
            $LH "$url" $FLAGS --form-factor=mobile --screenEmulation.mobile --output-path=reports/${name}mobile
            $LH "$url" $FLAGS --preset=desktop --output-path=reports/${name}desktop
          done
      - run: node .github/scripts/lighthouse_summary.mjs reports/*.report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: github.ref == 'refs/heads/main'
        with:
          python-version: "3.12"
          cache: pip
      - name: Publish to status page
        if: github.ref == 'refs/heads/main'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install -r ../requirements.txt
          python -m ops.publish_run lighthouse ../reports/*.report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: lighthouse-reports
          path: reports/
          if-no-files-found: warn
