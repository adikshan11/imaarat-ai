name: Nightly ELT

on:
  schedule:
    - cron: "30 20 * * *"  # 02:00 IST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  elt:
    name: Extract and transform
    runs-on: ubuntu-26.04
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Extract operational tables to Parquet
        run: python extract.py
        working-directory: pipeline
      - name: Transform and test with dbt on DuckDB
        run: dbt build --profiles-dir .
        working-directory: pipeline/dbt
      - name: Publish the analytics snapshot
        run: python publish.py
        working-directory: pipeline
      - name: Build the dbt docs and lineage site
        run: dbt docs generate --profiles-dir . --static
        working-directory: pipeline/dbt
      - name: Prepare the docs site
        run: mkdir site && cp pipeline/dbt/target/static_index.html site/index.html
      - name: Upload the docs site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

  docs:
    name: Publish docs
    needs: elt
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy the docs site
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
