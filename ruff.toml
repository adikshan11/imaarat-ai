line-length = 200
target-version = "py312"

[lint]
# E/F errors, I import order, B likely bugs, UP modern syntax, S security (the same checks as Bandit).
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S"]
# FastAPI declares form fields and dependencies as default arguments (Form(...), Query(...)).
ignore = ["B008"]

[lint.per-file-ignores]
"backend/tests/**" = ["S101"]
# Load-test and benchmark data only needs to look varied, not be unpredictable.
"backend/load/**" = ["S311"]
"backend/bench/**" = ["S311"]
